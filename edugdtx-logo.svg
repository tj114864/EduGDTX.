<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Nền Chuyển Màu Xanh -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2580ef" />
      <stop offset="60%" stop-color="#194eb8" />
      <stop offset="100%" stop-color="#0f2675" />
    </linearGradient>

    <!-- Gradient Vàng Kim Cho Khiên & Đuốc -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="40%" stop-color="#EAA635" />
      <stop offset="100%" stop-color="#A2670C" />
    </linearGradient>

    <!-- Gradient Vòng Phát Sáng Neon -->
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </linearGradient>

    <!-- Hiệu ứng Đổ Bóng Cho Chữ -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#05103a" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Nền Khung Bo Góc -->
  <rect width="600" height="600" rx="110" fill="url(#bgGradient)" />

  <!-- 2. Vòng Tròn Phát Sáng (Quả Cầu Glassmorphism) -->
  <circle cx="300" cy="240" r="185" fill="none" stroke="url(#glowGradient)" stroke-width="6" opacity="0.9" />
  <circle cx="300" cy="240" r="195" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4" />

  <!-- Dải Lụa / Vòng Sáng Phía Dưới -->
  <path d="M 120 370 C 180 430, 420 430, 480 370 C 440 400, 160 400, 120 370 Z" fill="#60a5fa" opacity="0.25" />

  <!-- 3. Cành Nguyệt Quế Hai Bên -->
  <g fill="#FFFFFF" opacity="0.95">
    <!-- Cành Trái -->
    <path d="M 230 110 C 150 150, 140 280, 220 330 C 190 280, 180 180, 230 110 Z" fill-opacity="0.1" />
    <!-- Lá trái -->
    <path d="M 210 115 Q 185 110 195 95 Q 215 105 210 115 Z" />
    <path d="M 195 135 Q 170 130 180 115 Q 200 125 195 135 Z" />
    <path d="M 180 160 Q 155 155 168 140 Q 188 150 180 160 Z" />
    <path d="M 170 190 Q 145 185 160 170 Q 178 180 170 190 Z" />
    <path d="M 165 220 Q 140 215 158 200 Q 175 210 165 220 Z" />
    <path d="M 168 250 Q 145 250 160 230 Q 178 240 168 250 Z" />
    <path d="M 178 280 Q 158 285 170 265 Q 188 270 178 280 Z" />

    <!-- Cành Phải -->
    <path d="M 390 115 Q 415 110 405 95 Q 385 105 390 115 Z" />
    <path d="M 405 135 Q 430 130 420 115 Q 400 125 405 135 Z" />
    <path d="M 420 160 Q 445 155 432 140 Q 412 150 420 160 Z" />
    <path d="M 430 190 Q 455 185 440 170 Q 422 180 430 190 Z" />
    <path d="M 435 220 Q 460 215 442 200 Q 425 210 435 220 Z" />
    <path d="M 432 250 Q 455 250 440 230 Q 422 240 432 250 Z" />
    <path d="M 422 280 Q 442 285 430 265 Q 412 270 422 280 Z" />
  </g>

  <!-- Ngôi Sao Đỉnh Khiên -->
  <polygon points="300,95 308,120 334,120 313,135 321,160 300,144 279,160 287,135 266,120 292,120" fill="url(#goldGradient)" />

  <!-- 4. Khiên Bảo Vệ Trung Tâm -->
  <path d="M 300 145 L 395 180 V 270 C 395 330 300 375 300 375 C 300 375 205 330 205 270 V 180 Z" fill="#0f2b7a" stroke="url(#goldGradient)" stroke-width="10" stroke-linejoin="round" />

  <!-- 5. Họa Tiết Bên Trong Khiên (Bánh Răng + Đuốc + Biểu Tượng GDTX) -->
  <g filter="url(#dropShadow)">
    <!-- Nửa Bánh Răng (Trái) -->
    <path d="M 270 210 A 45 45 0 0 0 250 285 L 235 295 L 245 310 L 265 300 A 60 60 0 0 1 290 195 Z" fill="url(#goldGradient)" opacity="0.8" />

    <!-- Ngọn Đuốc (Chính Giữa) -->
    <!-- Tay cầm đuốc -->
    <path d="M 293 250 L 307 250 L 303 330 L 297 330 Z" fill="url(#goldGradient)" />
    <path d="M 288 242 L 312 242 L 308 253 L 292 253 Z" fill="#FFE885" />
    <!-- Ngọn lửa -->
    <path d="M 300 185 C 320 210, 310 235, 300 240 C 290 235, 280 210, 300 185 Z" fill="url(#goldGradient)" />
    <path d="M 300 200 C 310 215, 305 230, 300 235 C 295 230, 290 215, 300 200 Z" fill="#FFE885" />

    <!-- Biểu Tượng Chữ GDTX / Cuốn Sách Stylized (Phải) -->
    <path d="M 320 240 L 350 240 L 380 300 L 350 300 L 335 270 L 320 300 Z" fill="#FFFFFF" />
    <!-- Quyển sách mở cách điệu -->
    <path d="M 310 305 Q 340 295 375 310 L 375 320 Q 340 305 310 320 Z" fill="#FFFFFF" />
  </g>

  <!-- 6. Ngôi Sao Lấp Lánh Nhỏ -->
  <path d="M 160 410 Q 160 425 145 425 Q 160 425 160 440 Q 160 425 175 425 Q 160 425 160 410 Z" fill="#93c5fd" />
  <path d="M 440 370 Q 440 380 430 380 Q 440 380 440 390 Q 440 380 450 380 Q 440 380 440 370 Z" fill="#93c5fd" />
  <path d="M 445 470 Q 445 480 435 480 Q 445 480 445 490 Q 445 480 455 480 Q 445 480 445 470 Z" fill="#93c5fd" />

  <!-- 7. Văn Bản "EDU GDTX" Dạng Vector 3D / Nổi -->
  <g text-anchor="middle" font-family="&#39;Montserrat&#39;, &#39;Arial Black&#39;, sans-serif" filter="url(#dropShadow)">
    <!-- Hàng 1: EDU -->
    <text x="300" y="435" font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="6">EDU</text>
    
    <!-- Hàng 2: GDTX -->
    <text x="300" y="525" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="8">GDTX</text>
  </g>
</svg>